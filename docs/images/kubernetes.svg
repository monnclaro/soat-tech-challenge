<svg width="680" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Infraestrutura Kubernetes — namespace soat</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Minikube outer -->
  <rect x="20" y="20" width="640" height="490" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#444441">Kubernetes · Minikube <tspan font-weight="400" font-size="11" fill="#888780">(via Terraform · infra/)</tspan></text>

  <!-- Namespace soat -->
  <rect x="44" y="62" width="592" height="420" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="68" y="84" font-family="Arial, sans-serif" font-size="11" fill="#378ADD">namespace: soat</text>

  <!-- Deployment soat-api -->
  <rect x="68" y="98" width="234" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="185" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Deployment soat-api</text>
  <text x="185" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1D9E75">2–10 pods · ASP.NET Core 9</text>

  <!-- StatefulSet postgres -->
  <rect x="378" y="98" width="234" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="495" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489">StatefulSet postgres</text>
  <text x="495" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F77DD">PostgreSQL 16-alpine</text>

  <!-- Arrow between deployment and statefulset (bidirectional) -->
  <line x1="302" y1="124" x2="376" y2="124" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="376" y1="132" x2="302" y2="132" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Service soat-api-service -->
  <rect x="68" y="196" width="234" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="185" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Service soat-api-service</text>
  <text x="185" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1D9E75">NodePort · :80</text>
  <line x1="185" y1="158" x2="185" y2="194" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Service postgres-service -->
  <rect x="378" y="196" width="234" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="495" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489">Service postgres-service</text>
  <text x="495" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F77DD">ClusterIP · :5432</text>
  <line x1="495" y1="158" x2="495" y2="194" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- HPA -->
  <rect x="68" y="290" width="140" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="138" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#633806">HPA</text>
  <text x="138" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#BA7517">CPU &gt; 70%</text>
  <text x="138" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#BA7517">min: 2 · max: 10</text>

  <!-- ConfigMap -->
  <rect x="226" y="290" width="140" height="68" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="296" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#71281C">ConfigMap</text>
  <text x="296" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D85A30">soat-api-config</text>
  <text x="296" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D85A30">env vars da API</text>

  <!-- Secret API -->
  <rect x="378" y="290" width="140" height="68" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="448" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#71281C">Secret soat-api</text>
  <text x="448" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D85A30">JWT · credenciais</text>
  <text x="448" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D85A30">da aplicação</text>

  <!-- Secret postgres -->
  <rect x="530" y="290" width="82" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="571" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#3C3489">Secret</text>
  <text x="571" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">postgres</text>
  <text x="571" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">-secret</text>

  <!-- PVC -->
  <rect x="378" y="400" width="234" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="495" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489">PVC postgres-pvc</text>
  <text x="495" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F77DD">1Gi · StorageClass standard</text>
  <line x1="495" y1="358" x2="495" y2="398" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
