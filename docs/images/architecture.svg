<svg width="680" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Arquitetura da aplicação — Clean Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- API (outermost) -->
  <rect x="40" y="20" width="600" height="370" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#993C1D">API</text>
  <text x="340" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D85A30">Controllers · middlewares · configuração HTTP</text>

  <!-- Infrastructure -->
  <rect x="76" y="84" width="528" height="282" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#185FA5">Infrastructure</text>
  <text x="340" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#378ADD">Repositórios · banco de dados · serviços externos</text>

  <!-- Application -->
  <rect x="116" y="144" width="448" height="186" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0F6E56">Application</text>
  <text x="340" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1D9E75">Casos de uso · DTOs · serviços de aplicação</text>

  <!-- Domain (center) -->
  <rect x="180" y="210" width="320" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Domain</text>
  <text x="340" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#534AB7">Entidades · interfaces · regras de negócio puras</text>
  <text x="340" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">Sem dependências externas</text>

  <!-- SharedKernel (bottom) -->
  <rect x="40" y="404" width="600" height="0" rx="0"/>
  <!-- SharedKernel as footer bar below everything -->

  <!-- Dependency arrows label -->
  <text x="340" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">↑ dependências apontam sempre para o centro</text>
</svg>
