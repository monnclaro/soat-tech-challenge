<svg width="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fluxo de deploy CI/CD — GitHub Actions</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1: git push -->
  <rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">git push → main</text>
  <line x1="340" y1="64" x2="340" y2="84" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: GitHub Actions -->
  <rect x="180" y="86" width="320" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0C447C">GitHub Actions detecta o push</text>
  <text x="340" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#378ADD">Self-hosted runner · Windows + Minikube</text>
  <line x1="340" y1="138" x2="340" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Checkout + Setup .NET -->
  <rect x="210" y="160" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Checkout + Setup .NET 9</text>
  <text x="340" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">actions/checkout · actions/setup-dotnet</text>
  <line x1="340" y1="204" x2="340" y2="218" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Parallel: Build+Test | Docker -->
  <line x1="340" y1="218" x2="340" y2="226" stroke="#888780" stroke-width="1"/>
  <line x1="160" y1="226" x2="520" y2="226" stroke="#888780" stroke-width="1"/>
  <line x1="160" y1="226" x2="160" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="226" x2="520" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Lane A: Build & Test -->
  <rect x="60" y="242" width="200" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="160" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Build &amp; Testes</text>
  <text x="160" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">dotnet restore</text>
  <text x="160" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">dotnet build --configuration Release</text>
  <text x="160" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">dotnet test --configuration Release</text>

  <!-- Lane B: Docker -->
  <rect x="420" y="242" width="200" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="520" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Docker build</text>
  <text x="520" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">docker build -t soat-api:latest</text>
  <text x="520" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">minikube delete + minikube start</text>
  <text x="520" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">minikube image load soat-api:latest</text>

  <!-- Rejoin -->
  <line x1="160" y1="310" x2="160" y2="356" stroke="#888780" stroke-width="1"/>
  <line x1="520" y1="310" x2="520" y2="356" stroke="#888780" stroke-width="1"/>
  <line x1="160" y1="356" x2="520" y2="356" stroke="#888780" stroke-width="1"/>
  <line x1="340" y1="356" x2="340" y2="370" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Deploy banco -->
  <rect x="180" y="372" width="320" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489">Deploy do banco de dados</text>
  <text x="340" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F77DD">kubectl apply -f k8s/postgres/ · rollout status statefulset</text>
  <line x1="340" y1="424" x2="340" y2="442" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Apply manifestos -->
  <rect x="140" y="444" width="400" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489">Aplicação dos manifestos Kubernetes</text>
  <text x="340" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">configmap.yaml · secret.yaml · deployment.yaml</text>
  <text x="340" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">service.yaml · hpa.yaml</text>
  <line x1="340" y1="508" x2="340" y2="526" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Rolling update -->
  <rect x="210" y="528" width="260" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#633806">Rolling update</text>
  <text x="340" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#BA7517">kubectl rollout status deployment/soat-api</text>
  <text x="340" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#BA7517">timeout: 180s</text>
  <line x1="340" y1="580" x2="340" y2="598" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Done -->
  <rect x="220" y="600" width="240" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Deploy concluído ✓</text>
  <text x="340" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1D9E75">kubectl get pods -n soat</text>
</svg>
