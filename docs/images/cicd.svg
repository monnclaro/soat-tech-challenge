<svg width="680" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fluxo de deploy CI/CD — GitHub Actions</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1: git push -->
  <rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">git push → main</text>
  <line x1="340" y1="64" x2="340" y2="84" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: GitHub Actions -->
  <rect x="180" y="86" width="320" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0C447C">GitHub Actions detecta o push</text>
  <text x="340" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#378ADD">Self-hosted runner · Windows + Minikube</text>
  <line x1="340" y1="138" x2="340" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Checkout + Setup .NET -->
  <rect x="210" y="160" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Checkout + Setup .NET 9</text>
  <text x="340" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">actions/checkout · actions/setup-dotnet</text>
  <line x1="340" y1="204" x2="340" y2="222" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 4: Garantir Minikube rodando -->
  <rect x="170" y="224" width="340" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Garantir Minikube rodando</text>
  <text x="340" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">minikube status → minikube start (se necessário)</text>

  <!-- Parallel: Build+Test | Docker -->
  <line x1="340" y1="276" x2="340" y2="284" stroke="#888780" stroke-width="1"/>
  <line x1="160" y1="284" x2="520" y2="284" stroke="#888780" stroke-width="1"/>
  <line x1="160" y1="284" x2="160" y2="298" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="284" x2="520" y2="298" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Lane A: Build & Test -->
  <rect x="60" y="300" width="200" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Build &amp; Testes</text>
  <text x="160" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">dotnet restore</text>
  <text x="160" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">dotnet build --configuration Release</text>
  <text x="160" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">dotnet test --configuration Release</text>

  <!-- Lane B: Docker -->
  <rect x="420" y="300" width="200" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="520" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#085041">Docker build</text>
  <text x="520" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">docker build -t soat-api:latest</text>
  <text x="520" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1D9E75">minikube image load soat-api:latest</text>

  <!-- Rejoin -->
  <line x1="160" y1="368" x2="160" y2="414" stroke="#888780" stroke-width="1"/>
  <line x1="520" y1="368" x2="520" y2="414" stroke="#888780" stroke-width="1"/>
  <line x1="160" y1="414" x2="520" y2="414" stroke="#888780" stroke-width="1"/>
  <line x1="340" y1="414" x2="340" y2="428" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Terraform apply -->
  <rect x="140" y="430" width="400" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489">Terraform apply (infra/)</text>
  <text x="340" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">namespace · postgres (Secret+PVC+StatefulSet+Service)</text>
  <text x="340" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">app (ConfigMap+Secret+Deployment+Service+HPA)</text>
  <text x="340" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F77DD">restart_trigger = github.run_id → força novo rollout</text>
  <line x1="340" y1="508" x2="340" y2="524" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Verificação pós-apply -->
  <rect x="180" y="526" width="320" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#633806">Verificação pós-apply</text>
  <text x="340" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#BA7517">kubectl rollout status statefulset/postgres (120s)</text>
  <text x="340" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#BA7517">kubectl rollout status deployment/soat-api (180s)</text>
  <line x1="340" y1="590" x2="340" y2="606" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Done -->
  <rect x="220" y="608" width="240" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#085041">Deploy concluído ✓</text>
  <text x="340" y="646" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1D9E75">kubectl get pods -n soat</text>
</svg>
