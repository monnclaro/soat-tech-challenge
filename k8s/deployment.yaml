apiVersion: apps/v1
kind: Deployment
metadata:
  name: soat-api
  namespace: soat

spec:
  replicas: 2

  # Node t3.small (custo mínimo, ver ADR 0008) não tem folga de memória/pods
  # pra um 3º pod temporário durante rollout (maxSurge=1 por padrão tentaria
  # subir 1 pod novo antes de derrubar um velho — "Insufficient memory, Too
  # many pods"). Troca 1 de cada vez, sempre dentro do espaço das 2 réplicas
  # que já rodam hoje.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: soat-api

  template:
    metadata:
      labels:
        app: soat-api

    spec:
      # Init container do New Relic: copia o profiler .NET para um volume
      # compartilhado, sem precisar embutir o agente na imagem da aplicação
      # (padrão oficial do New Relic para Kubernetes) — ver
      # https://github.com/newrelic/newrelic-dotnet-init
      #
      # A imagem em si não copia nada sozinha (sem ENTRYPOINT/CMD) — ela só
      # guarda os arquivos do agente em /instrumentation dentro dela. Quem
      # copia normalmente é o New Relic Kubernetes Agents Operator (que não
      # instalamos); sem ele, precisa do "command" explícito abaixo — mesmo
      # comando que o operator injetaria (confirmado em
      # github.com/newrelic/k8s-agents-operator, internal/apm/dotnet.go).
      initContainers:
        - name: newrelic-instrumentation
          image: newrelic/newrelic-dotnet-init:latest
          command: ["cp", "-r", "/instrumentation/.", "/newrelic-instrumentation/"]
          volumeMounts:
            - mountPath: /newrelic-instrumentation
              name: newrelic-instrumentation

      containers:
        - name: soat-api

          # Substituído pelo CI/CD (envsubst) com a tag da imagem publicada no ECR.
          image: ${ECR_IMAGE}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: soat-api-config

            - secretRef:
                name: soat-api-secret

          volumeMounts:
            - mountPath: /newrelic-instrumentation
              name: newrelic-instrumentation

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: newrelic-instrumentation
          emptyDir: {}
