# Template — NÃO aplicado diretamente. O CI/CD gera o Secret real em tempo de
# deploy (kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -)
# a partir de:
#   - RDS: aws ssm get-parameter /soat/{env}/rds/endpoint + aws secretsmanager
#     get-secret-value no ARN publicado em /soat/{env}/rds/secret-arn (infra-database)
#   - JWT: aws secretsmanager get-secret-value no ARN publicado em
#     /soat/{env}/jwt/secret-arn (repo lambda)
# Isso evita credenciais de produção em texto plano num arquivo versionado.
# Para rodar localmente, preencha os valores abaixo e aplique manualmente.

apiVersion: v1
kind: Secret

metadata:
  name: soat-api-secret
  namespace: soat

type: Opaque

stringData:
  ConnectionStrings__Default: "Host=postgres-service;Port=5432;Database=soattechchallenge;Username=postgres;Password=postgres"
  JwtSettings__Secret: "SuaChaveSuperSecretaComMinimo32Caracteres"
  JwtSettings__ExpirationHours: "2"
  Webhook__Secret: "secret_webhook"
  NEW_RELIC_LICENSE_KEY: "sua-license-key-newrelic"
