name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # ── 1. CHECKOUT ──────────────────────────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      # ── 2. GARANTIR QUE O MINIKUBE ESTÁ RODANDO ──────────────
      - name: Garantir que o Minikube está rodando
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          chcp 65001 > $null

          $hostStatus = minikube status --format='{{.Host}}' 2>$null

          if ($LASTEXITCODE -ne 0 -or $hostStatus -ne 'Running') {
            Write-Host "Minikube não está rodando. Iniciando..."
            minikube start --driver=docker --wait=all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            Write-Host "Minikube já está em execução."
          }

          $kubeconfigPath = if ($env:KUBECONFIG) {
            $env:KUBECONFIG
          } else {
            Join-Path $env:USERPROFILE ".kube\config"
          }

          "KUBECONFIG=$kubeconfigPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_VAR_kubeconfig_path=$kubeconfigPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:KUBECONFIG = $kubeconfigPath

          kubectl config use-context minikube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl wait --for=condition=Ready node/minikube --timeout=300s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 3. BUILD DA APLICAÇÃO ────────────────────────────────
      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build da aplicação
        run: dotnet build --no-restore --configuration Release


      # ── 5. BUILD DA IMAGEM DOCKER ────────────────────────────
      - name: Build da imagem Docker
        shell: powershell
        run: |
          docker build `
            -t soat-api:latest `
            -f src/Api/Dockerfile .

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 6. CARREGAR IMAGEM NO CLUSTER ────────────────────────
      - name: Carregar imagem no cluster
        shell: powershell
        run: |
          minikube image load soat-api:latest

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 7. PROVISIONAR INFRAESTRUTURA COM TERRAFORM ──────────
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Diagnóstico Terraform
        shell: powershell
        working-directory: infra
        run: |
          Write-Host "Diretório:"
          pwd

          Write-Host ""
          Write-Host "Terraform encontrado:"
          Get-Command terraform

          Write-Host ""
          Write-Host "Versão:"
          terraform version

          Write-Host ""
          Write-Host "Arquivos da pasta:"
          dir

      - name: Terraform Init
        shell: powershell
        working-directory: infra
        run: |
          terraform init -input=false

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Terraform Format Check
        shell: powershell
        working-directory: infra
        run: |
          terraform fmt -check

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Terraform Validate
        shell: powershell
        working-directory: infra
        run: |
          terraform validate

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Terraform Apply
        shell: powershell
        working-directory: infra
        run: |
          terraform apply `
            -auto-approve `
            -input=false `
            -var="restart_trigger=${{ github.run_id }}"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 8. VERIFICAR STATUS DOS PODS ─────────────────────────
      - name: Verificar status dos pods
        shell: powershell
        run: |
          kubectl get pods -n soat

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }