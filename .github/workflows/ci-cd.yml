name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # ── 1. CHECKOUT ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. BUILD DA APLICAÇÃO ────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # ── 3. TESTES AUTOMATIZADOS ──────────────────────────────
      - name: Testes
        run: dotnet test --no-build --configuration Release --verbosity normal

      # ── 4. BUILD DA IMAGEM DOCKER ────────────────────────────
      - name: Build da imagem
        shell: powershell
        run: |
          docker build `
            -t soat-api:latest `
            -f src/Api/Dockerfile .

      # ── 5. GARANTIR MINIKUBE E KUBECONFIG ────────────────────
      - name: Iniciar Minikube e configurar contexto
        shell: powershell
        run: |
          # Define o kubeconfig explicitamente
          $kube = "$env:USERPROFILE\.kube\config"
          echo "KUBECONFIG=$kube" >> $env:GITHUB_ENV
          $env:KUBECONFIG = $kube

          # Inicia o minikube se não estiver rodando
          $state = minikube status --format='{{.Host}}' 2>$null
          if ($state -ne "Running") {
            Write-Host "Iniciando minikube..."
            minikube start
          }

          # Atualiza o contexto com a porta atual da API
          minikube update-context

          # Confirma que o cluster responde
          kubectl cluster-info
          kubectl get nodes

      # ── 6. CARREGAR IMAGEM NO MINIKUBE ───────────────────────
      - name: Carregar imagem no Minikube
        shell: powershell
        run: minikube image load soat-api:latest

      # ── 7. DEPLOY DO BANCO DE DADOS ──────────────────────────
      - name: Deploy PostgreSQL
        shell: powershell
        run: kubectl apply -f k8s/postgres/

      - name: Aguardar PostgreSQL
        shell: powershell
        run: kubectl rollout status statefulset/postgres -n soat --timeout=120s

      # ── 8. APLICAÇÃO DOS MANIFESTOS YAML ─────────────────────
      - name: Aplicar manifestos
        shell: powershell
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      # ── 9. DEPLOY NO CLUSTER ─────────────────────────────────
      - name: Atualizar imagem
        shell: powershell
        run: |
          kubectl set image deployment/soat-api `
            soat-api=soat-api:latest `
            -n soat

      - name: Aguardar rollout
        shell: powershell
        run: kubectl rollout status deployment/soat-api -n soat --timeout=180s

      # ── 10. VERIFICAÇÃO FINAL ─────────────────────────────────
      - name: Status dos pods
        shell: powershell
        run: kubectl get pods -n soat