name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AWS Academy: credenciais de sessão temporárias (expiram com o Lab), não
# suporta OIDC nem IAM role de longa duração — ver docs/adr "Prioridade de
# custo e AWS Academy".
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  # AWS_DEFAULT_REGION (CLI) e AWS_REGION (SDKs, ex.: aws-actions/amazon-ecr-login
  # usa o SDK JS por baixo) não são sinônimos — algumas ferramentas só reconhecem
  # uma das duas, então mantemos as duas.
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1
  ECR_REPOSITORY: soat-api

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 9.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    name: Build image & Deploy
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: producao
    env:
      ENVIRONMENT: producao
    steps:
      - uses: actions/checkout@v4.2.2

      # Sem Terraform próprio neste repo (infra de cluster é do infra-k8s) —
      # o repositório ECR não existe até algum "docker push" precisar dele.
      # Idempotente: só cria se ainda não existir.
      - name: Garantir repositório ECR
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f src/Api/Dockerfile .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Atualizar kubeconfig
        run: aws eks update-kubeconfig --name soat-${{ env.ENVIRONMENT }} --region us-east-1

      # Precisa vir antes do Secret abaixo: kubectl apply não cria a
      # namespace sozinho, e "soat-api-secret" é criado em "-n soat".
      - name: Criar namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Gerar Secret a partir do SSM Parameter Store (RDS + JWT)
        run: |
          DB_ENDPOINT=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/endpoint" --query Parameter.Value --output text)
          DB_NAME=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/db-name" --query Parameter.Value --output text)
          DB_USER=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/username" --query Parameter.Value --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/rds/password" --with-decryption --query Parameter.Value --output text)
          JWT_SECRET=$(aws ssm get-parameter --name "/soat/${ENVIRONMENT}/jwt/secret" --with-decryption --query Parameter.Value --output text)

          kubectl create secret generic soat-api-secret -n soat \
            --from-literal=ConnectionStrings__Default="Host=$DB_ENDPOINT;Port=5432;Database=$DB_NAME;Username=$DB_USER;Password=$DB_PASSWORD" \
            --from-literal=JwtSettings__Secret="$JWT_SECRET" \
            --from-literal=JwtSettings__ExpirationHours="2" \
            --from-literal=Webhook__Secret="${{ secrets.WEBHOOK_SECRET }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests
        env:
          ECR_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout
        run: kubectl rollout status deployment/soat-api -n soat --timeout=180s

      - name: Publicar IP público do node em SSM (consumido pelo repo lambda)
        run: |
          # Sem ALB (prioridade de custo — ver docs/adr): o API Gateway do repo
          # lambda chama direto o IP público de um node na porta NodePort
          # (k8s/service.yaml). Publica o IP do primeiro node Ready.
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          if [ -n "$NODE_IP" ]; then
            aws ssm put-parameter --name "/soat/${ENVIRONMENT}/app/node-ip" --type String --value "$NODE_IP" --overwrite
          else
            echo "::warning::Nenhum node com IP público encontrado; verifique se os nodes do EKS estão em subnet pública."
          fi
