name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # ── 1. CHECKOUT ──────────────────────────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      # ── 2. GARANTIR QUE O MINIKUBE ESTÁ RODANDO ──────────────
      - name: Garantir que o Minikube está rodando
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $hostStatus = minikube status --format='{{.Host}}' 2>$null
          if ($LASTEXITCODE -ne 0 -or $hostStatus -ne 'Running') {
            Write-Host "Minikube não está rodando. Iniciando..."
            $ErrorActionPreference = 'Stop'
            minikube start
          } else {
            Write-Host "Minikube já está em execução."
          }

      # ── 3. BUILD DA APLICAÇÃO ────────────────────────────────
      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build da aplicação
        run: dotnet build --no-restore --configuration Release

      # ── 4. EXECUÇÃO DOS TESTES AUTOMATIZADOS ─────────────────
      - name: Execução dos testes automatizados
        run: dotnet test --no-build --configuration Release --verbosity normal

      # ── 5. BUILD DA IMAGEM DOCKER ────────────────────────────
      - name: Build da imagem Docker
        shell: powershell
        run: |
          docker build `
            -t soat-api:latest `
            -f src/Api/Dockerfile .

      # ── 6. CARREGAR IMAGEM NO CLUSTER ────────────────────────
      - name: Carregar imagem no cluster
        shell: powershell
        run: minikube image load soat-api:latest

      # ── 7. PROVISIONAR INFRAESTRUTURA COM TERRAFORM ──────────
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        shell: powershell
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform apply
        shell: powershell
        working-directory: infra
        run: terraform apply -auto-approve -input=false -var="restart_trigger=${{ github.run_id }}"

      # ── 8. VERIFICAÇÃO PÓS-APPLY ──────────────────────────────
      - name: Aguardar banco de dados ficar pronto
        shell: powershell
        run: kubectl rollout status statefulset/postgres -n soat --timeout=120s

      - name: Aguardar rollout da aplicação
        shell: powershell
        run: kubectl rollout status deployment/soat-api -n soat --timeout=180s

      # ── 9. VERIFICAR STATUS DOS PODS ──────────────────────────
      - name: Verificar status dos pods
        shell: powershell
        run: kubectl get pods -n soat