name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:

      # ── 1. CHECKOUT ──────────────────────────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4.2.2

      # ── 2. BUILD DA APLICAÇÃO ────────────────────────────────
      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build da aplicação
        run: dotnet build --no-restore --configuration Release

      # ── 3. EXECUÇÃO DOS TESTES AUTOMATIZADOS ─────────────────
      - name: Execução dos testes automatizados
        run: dotnet test --no-build --configuration Release --verbosity normal

      # ── 4. BUILD DA IMAGEM DOCKER ────────────────────────────
      - name: Build da imagem Docker
        shell: powershell
        run: |
          docker build `
            -t soat-api:latest `
            -f src/Api/Dockerfile .

      # ── 5. DEPLOY NO CLUSTER KUBERNETES ──────────────────────
      - name: Reiniciar cluster Minikube
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $kube = "$env:USERPROFILE\.kube\config"
          echo "KUBECONFIG=$kube" >> $env:GITHUB_ENV
          $env:KUBECONFIG = $kube

          Write-Host "Deletando cluster anterior para garantir estado limpo..."
          minikube delete 2>$null | Out-Null

          Write-Host "Iniciando minikube..."
          minikube start --driver=docker

          minikube update-context

          Write-Host "Aguardando API server ficar disponível..."
          $retries = 0
          do {
            Start-Sleep -Seconds 5
            kubectl cluster-info 2>$null | Out-Null
            $retries++
            Write-Host "Tentativa $retries..."
          } while ($LASTEXITCODE -ne 0 -and $retries -lt 24)

          if ($LASTEXITCODE -ne 0) {
            Write-Host "API server não respondeu após 120s"
            exit 1
          }

          kubectl cluster-info
          kubectl get nodes

      - name: Carregar imagem no cluster
        shell: powershell
        run: minikube image load soat-api:latest

      # ── 6. CRIAR NAMESPACE ────────────────────────────────────
      - name: Criar namespace
        shell: powershell
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl get namespace soat 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { kubectl create namespace soat }

      # ── 7. DEPLOY DO BANCO DE DADOS ──────────────────────────
      - name: Deploy do banco de dados
        shell: powershell
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: kubectl apply -f k8s/postgres/

      - name: Aguardar banco de dados ficar pronto
        shell: powershell
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: kubectl rollout status statefulset/postgres -n soat --timeout=120s

      # ── 8. APLICAÇÃO DOS MANIFESTOS YAML NO CLUSTER ──────────
      - name: Aplicação dos manifestos YAML no cluster
        shell: powershell
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout da aplicação
        shell: powershell
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: kubectl rollout status deployment/soat-api -n soat --timeout=180s

      - name: Verificar status dos pods
        shell: powershell
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: kubectl get pods -n soat